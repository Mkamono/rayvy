name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Rayvy.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-app.sh

      - name: Package release asset
        id: package
        run: |
          set -euo pipefail
          asset_name="Rayvy-${{ steps.version.outputs.version }}-arm64.zip"
          ditto -c -k --keepParent dist/Rayvy.app "$asset_name"
          shasum -a 256 "$asset_name" | tee "$asset_name.sha256"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.asset_name }}" \
            "${{ steps.package.outputs.asset_name }}.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
